	/** Standalone local preview using the same production editor; no HTTP server required. */
	const root = document.querySelector("#app");
	const locale = document.querySelector("#preview-locale");
	const theme = document.querySelector("#preview-theme");
	const storage = {
		getItem: (key) => localStorage.getItem(key),
		setItem: (key, value) => localStorage.setItem(key, value)
	};
	let dispose = mountWorkflow(root, storage, locale.value, theme.value);
	const update = () => {
		dispose();
		dispose = mountWorkflow(root, storage, locale.value, theme.value);
	};
	locale.addEventListener("change", update);
	theme.addEventListener("change", update);
